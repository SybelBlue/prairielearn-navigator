name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  cli:
    name: Lint and CLI tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run core and CLI tests
        run: npm run test:cli
      - name: Test the packed npm library
        run: npm run test:package
      - name: Smoke-test CLI on a clean course
        run: node packages/cli/dist/cli.cjs check --format github src/test-cli/fixtures/clean
      - name: Smoke-test library import
        run: node -e "import('./packages/cli/dist/index.js').then(m => { if (typeof m.createQuestionFileResolver !== 'function') process.exit(1) })"
      - name: Check npm package contents
        run: npm pack --dry-run
        working-directory: packages/cli
