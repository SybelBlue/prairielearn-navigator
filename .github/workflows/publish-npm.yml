name: Publish CLI to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    # Releases are tagged vX.Y.Z by `make publish`; the extension and CLI share that version.
    # Allow manual dispatch (ref_name will be a branch or tag chosen by the operator).
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    # Must match the environment on the npm trusted publisher.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Check tag matches package version
        if: github.event_name == 'release'
        run: |
          version="v$(node -p "require('./packages/cli/package.json').version")"
          if [ "$version" != "${{ github.ref_name }}" ]; then
            echo "::error::Release tag ${{ github.ref_name }} does not match packages/cli/package.json ($version)"
            exit 1
          fi

      - run: npm run lint
      - run: npm run test:cli
      - run: npm run test:package
      - run: npm run build:npm
      - run: cp LICENSE packages/cli/

      # The trusted publisher only allows staged publishes: the version stays
      # private until a maintainer approves it with 2FA on npmjs.com, which
      # `make publish` opens. Provenance requires this public repository.
      - run: npm stage publish --provenance
        working-directory: packages/cli
